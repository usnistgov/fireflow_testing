        options:
          use_latin1: true
          integer_byteord_override: [2,1]
          time_meas_pattern: null
          fix_log_scale_offsets: true

    # no idea what this machine is, the only indication in the file is that it
    # as made with FACSDiva, so maybe a BD machine
    SDY4:
      - name: ES481973.248766.fcs
        options:
          trim_value_whitespace: true
          allow_empty: true
          ignore_time_gain: true

    # LSRII
    SDY9:
      - name: Compensation Controls_7AAD PE-Cy5 Stained Control.240026.fcs
        options:
          trim_value_whitespace: true
          ignore_time_gain: true

      - name: Compensation Controls_7AAD Stained Control--0010.239801.fcs
        options:
          trim_value_whitespace: true
          ignore_time_gain: true

      - name: Compensation Controls_7AAD Stained Control--0011.239826.fcs
