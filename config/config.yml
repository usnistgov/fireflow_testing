          # not sure what's wrong with this key, log scale with float layout
          substitute_standard_key_values: [{}, {"P12E": [".*", "0,0", false]}]

      - name: Adult001_comp_24hrs_Compensation Controls_405 E 450,2f,50 Stained Control_003.632069.635138.fcs
        options:
          <<: *sdy1115
          substitute_standard_key_values: [{}, {"P12E": [".*", "0,0", false]}]

      - name: Adult001_HRV_6hrs.631634.fcs
