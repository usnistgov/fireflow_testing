  # FASCLyric
  - src:
      url_root: https://zenodo.org/records/17222100/files/
      dataset_id: zenodo_FACSLyric
      filemap:
        4g2_t1.fcs: 20250409_DV2_4G2_T1_340.fcs
        4g2_t2.fcs: 20250409_DV2_4G2_T2_340_001.fcs
        4g2_t3.fcs: 20250409_DV2_4G2_T3_340.fcs
