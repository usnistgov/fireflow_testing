      file_names:
        - Adult001_HRV_24hrs.632136.635136.fcs
        - Adult001_unstim_24hrs.632137.635146.fcs
    options:
      <<: *sdy1115
      # timestamps are a space in this one
      trim_value_whitespace: true
      allow_empty_values: true

