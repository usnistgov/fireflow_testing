test_files:
  # Sony SA3800
  - src:
      url_root: https://zenodo.org/records/7971252/files/
      dataset_id: zenodo_SonySA3800
      filemap:
        a1.fcs: A01%20Well%20-%20A01%20WLSM.fcs
        a2.fcs: A02%20Well%20-%20A02%20WLSM.fcs
        a3.fcs: A03%20Well%20-%20A03%20WLSM.fcs
    parse:
      options:
        ignore_supp_text: true

  # Attune NxT
  - src:
      url_root: https://zenodo.org/records/7352402/files/
      dataset_id: zenodo_AttuneNxt
      filemap:
        bl1.fcs: Tmem119%20x%20IAB%20AAV%20NJG%201.6.22_Compensation_BL1-A.fcs
        bl3.fcs: Tmem119%20x%20IAB%20AAV%20NJG%201.6.22_Compensation_BL3-A.fcs
        rl1.fcs: Tmem119%20x%20IAB%20AAV%20NJG%201.6.22_Compensation_RL1-A.fcs
        rl3.fcs: Tmem119%20x%20IAB%20AAV%20NJG%201.6.22_Compensation_RL3-A.fcs
    parse:
      machine: tfs_attune_nxt
      options:
        trim_trailing_whitespace: true
        ignore_time_optical_keys: [V, F, L]

  # Helios (according to https://elifesciences.org/reviewed-preprints/95494v2)
  - src:
      url_root: https://zenodo.org/records/7982165/files/
      dataset_id: zenodo_Helios
      filemap:
        am_non_jak2.fcs: AM_Non_JAK2.fcs
        cj_jakj2.fcs: CJ_JAK2.fcs
        fd_non_jak2.fcs: FD_Non_JAK2.fcs
    parse:
      machine: sbt_helios
      options:
        text_correction: [0, -1]
        data_correction: [0, -1]
        text_data_correction: [0, -1]
        append_standard_keywords:
          TIMESTEP: "1.0"

  # FACSDiscover A8
  - src:
      url_root: https://zenodo.org/records/15726118/files/
      dataset_id: zenodo_FACSDiscoverA8
      filemap:
        hd20_bm.fcs: HD%20BM%201.fcs
        hd_pbmc.fcs: HD%20PBMC.fcs
    parse:
      options:
        trim_value_whitespace: true
        allow_other_feature: true

  # Imagestream
  - src:
