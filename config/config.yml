          trim_value_whitespace: true
          allow_empty: true

      - name: Adult001_unstim_24hrs.632137.635146.fcs
        options:
          <<: *sdy1115
          trim_value_whitespace: true
          allow_empty: true

    # unknown machine, made with FACSDiva
