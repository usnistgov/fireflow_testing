  - src:
      immport_id: SDY2947
      file_names:
        - CCR4-FMO.1208727.fcs
        - CCR6-FMO.1208728.fcs
        - CCR7-FMO.1208729.fcs
    options:
      time_meas_pattern: null

  # Each of these Accuri files has roughly the same set of problems
  # - DATA offset end is 1 too high
  # - STEXT doesn't exist but overlaps with TEXT (and is weirdly very different)
  # - in some case DATA in TEXT is wildly off (its safe to ignore since HEADER
  #   is correct)
  - src:
      fr_id: FR-FCM-ZZZ4
      file_names:
        - Accuri - C6.fcs
    options:
      warnings_are_errors: true
      ignore_supp_text: true
      version_override: FCS3.1
      data_correction: [0, -1]
      text_data_correction: [0, -1]
      parse_indexed_spillover: true
      # I'm assuming these are centiseconds and not 1/60th seconds since they
      # exceed 59 but never exceed 99
      time_pattern: "%H:%M:%S:%@"
  
  - src:
      fr_id: FR-FCM-ZZZ4
      file_names:
      - Accuri - C6 - A01 H2O.fcs
    options:
      warnings_are_errors: true
      text_correction: [0, -1]
      ignore_supp_text: true
      data_correction: [0, -1]
      allow_header_text_offset_mismatch: true
      version_override: FCS3.1
      ignore_text_data_offsets: true
      parse_indexed_spillover: true
      time_pattern: "%H:%M:%S:%@"
  
  - src:
      fr_id: FR-FCM-ZZZ4
      file_names:
        - Accuri - C6 - A02 Spherotech 8 Peak Beads.fcs
    options:
      warnings_are_errors: true
      ignore_supp_text: true
      text_correction: [0, -1]
      data_correction: [0, -1]
      allow_header_text_offset_mismatch: true
      version_override: FCS3.1
      ignore_text_data_offsets: true
      parse_indexed_spillover: true
      time_pattern: "%H:%M:%S:%@"
  
  - src:
      fr_id: FR-FCM-ZZZ4
      file_names:
        - Accuri - C6 - A03 HPB - CD45 PerCP.fcs
    options:
      warnings_are_errors: true
      ignore_supp_text: true
      text_correction: [0, -1]
      data_correction: [0, -1]
      allow_header_text_offset_mismatch: true
      version_override: FCS3.1
      ignore_text_data_offsets: true
      parse_indexed_spillover: true
      time_pattern: "%H:%M:%S:%@"
  
  - src:
      fr_id: FR-FCM-ZZZ4
      file_names:
        - 1 WT_001.fcs
    options:
      # second DATA offset is 0
      squish_offsets: true
      # offsets have whitespace
      trim_value_whitespace: true
      # STEXT duplicates TEXT
      ignore_supp_text: true
      # BYTEORD is should only be 2 bytes
      integer_byteord_override: [1,2]
      # BTIM/ETIM have milliseconds
      time_pattern: "%H:%M:%S:%3f"
      
  - src:
      fr_id: FR-FCM-ZZZ4
      file_names:
        - 3215apc 100004.fcs
    options:
      warnings_are_errors: true
      integer_byteord_override: [3,2,1]
      
  # TODO fix blank warnings
  - src:
      fr_id: FR-FCM-ZZZ4
      file_names:
        - Applied Biosystems - Attune.fcs
    options:
      # warnings_are_errors: true
      trim_trailing_whitespace: true
      # this TEXT has blanks
      use_literal_delims: true
      allow_empty_values: true
      # voltage given for time channel
      ignore_time_optical_keys: [V]
  
  - src:
      fr_id: FR-FCM-ZZZ4
      file_names:
        - BD - FACS Aria II.fcs
    options:
      warnings_are_errors: false
      # analysis has -1 for end
      allow_negative: true
      # This file also has $P14DISPLAY, not only which is nonstandard (the
      # right keyword is $PnD) but it's version is 3.0 not 3.1. It also isn't
      # the correct value ("LIN" vs "Linear,0,0"). This machine sets gain to
      # be 12.5 for time which is exactly the inverse of TIMESTEP (0.08); idk
      # why
      ignore_time_optical_keys: [V]
      # DATATYPE is F but scales are log with non-unit gain
      substitute_standard_key_values: [{}, {"P[0-9]+E": [".*", "0,0", false]}]
      demote_from_standard: [[P14DISPLAY], ["P[0-9]+G"]]
        
  # this one seems near perfect except for the offset spacing thing, lots of
  # keys are also only whitespace so blanks need to be allowed
  - src:
      fr_id: FR-FCM-ZZZ4
      file_names:
        - BD - FACS Aria II - Compensation Controls_B515 Stained Control.fcs
    options:
      # warnings_are_errors: true
      trim_value_whitespace: true
      allow_empty_values: true
      ignore_time_gain: true
  
    # ditto
  - src:
      fr_id: FR-FCM-ZZZ4
      file_names:
        - BD - FACS Aria II - Compensation Controls_G560 Stained Control.fcs
    options:
      # warnings_are_errors: true
      trim_value_whitespace: true
      allow_empty_values: true
      ignore_time_gain: true
  
    # ditto
  - src:
      fr_id: FR-FCM-ZZZ4
      file_names:
        - BD - FACS Aria II - Compensation Controls_G610 Stained Control.fcs
    options:
      # warnings_are_errors: true
      trim_value_whitespace: true
      allow_empty_values: true
      ignore_time_gain: true
  
    # ditto
  - src:
      fr_id: FR-FCM-ZZZ4
      file_names:
        - BD - FACS Aria II - Compensation Controls_G660 Stained Control.fcs
    options:
      # warnings_are_errors: true
      trim_value_whitespace: true
      allow_empty_values: true
      ignore_time_gain: true
  
  - src:
      fr_id: FR-FCM-ZZZ4
      file_names:
        - BD - FACS Aria II - Compensation Controls_G710 Stained Control.fcs
    options:
      # warnings_are_errors: true
      trim_value_whitespace: true
      allow_empty_values: true
      # this file appears to be cut in half
      data_correction: [0, -189504]
      ignore_text_data_offsets: true
      replace_standard_key_values: {TOT: "6052"}
      ignore_time_gain: true
  
  - src:
      fr_id: FR-FCM-ZZZ4
      file_names:
        - Beckman Coulter - Cyan.fcs
    options:
      # warnings_are_errors: true
      trim_value_whitespace: true
      other_width: 10
      # dreaded PnE log issue
      fix_log_scale_offsets: true
      integer_byteord_override: [1,2]
      # DATA offsets in TEXT are wrong
      allow_header_text_offset_mismatch: true
      # one of the OTHER segments drove off the cliff at the end of the file,
      # so just ignore them (only one, but lots of empty segments)
      max_other: 0
      allow_empty_values: true
      ignore_time_optical_keys: [P, L, V, O]
      # all the wavelengths are 0.0 (infinite energy, nice idea)
      demote_from_standard: [[], ["P[0-9]+L"]]
      date_pattern: "%d %b %Y"
  
  - src:
      fr_id: FR-FCM-ZZZ4
      file_names:
        - Beckman Coulter - Cytomics FC500.LMD
    options:
      # warnings_are_errors: true
      trim_value_whitespace: true
      use_literal_delims: true
      # offsets are apparently systemically off
      text_correction: [0, -1]
      data_correction: [0, -1]
      # this file has a known issue in that the CXP software uses 10 for PnB
      # when the actual width is 16
      integer_widths_from_byteord: true
      allow_empty_values: true
      time_meas_pattern: null
      # hmm....
      demote_from_standard:
        - [RUNNUMBER, INSTADDRESS]
        # this has DFC*TO* kws that point to non-existent channels
        - ["DFC[0-9]TO5", "DFC5TO[0-9]"]
  
  - src:
      fr_id: FR-FCM-ZZZ4
      file_names:
        - Beckman Coulter - Gallios.LMD
    options:
      # warnings_are_errors: true
      # lots of DFCxTOy keys (which don't even match $PAR), and also $PnG
      # PnE has space in front of it
      trim_value_whitespace: true
      # trimming spaces results in lots of blank keys
      allow_empty_values: true
      # - comp matrix has extra values which seems screwy
      # - has gain despite being 2.0 file
      # - time has voltage
      version_override: FCS3.0
      demote_from_standard: [[RUNNUMBER], ["DFC[0-9]+TO[0-9]+"]]
      ignore_time_optical_keys: [V]
      allow_header_text_offset_mismatch: true
      allow_missing_supp_text: true
      append_standard_keywords:
        TIMESTEP: "1.0"
        # hack since these are missing (also allow the offsets to mismatch)
        BEGINDATA: "0"
        ENDDATA: "0"
        BEGINANALYSIS: "0"
        ENDANALYSIS: "0"
        
    # this parses fine but spews tons of warnings. Some are for dropping keys
    # that are parsed as ints but should be floats (ie ff is wrong), will also
    # freak out that PnB is one greater than 2^32-1
  - src:
      fr_id: FR-FCM-ZZZ4
      file_names:
        - Beckman Coulter - MoFlo Astrios - linear settings.fcs
    options:
      # warnings_are_errors: true
      other_width: 14
      ignore_time_optical_keys: [P]
      date_pattern: "%d %b %Y"
  
    # ditto
  - src:
      fr_id: FR-FCM-ZZZ4
      file_names:
        - Beckman Coulter - MoFlo Astrios - log settings.fcs
    options:
      # warnings_are_errors: true
      other_width: 14
      # the date format is wrong
      date_pattern: "%d %b %Y"
      # PnP for time channel
      ignore_time_optical_keys: [P]
  
    # - suffers from PnE log X,0 error
    # - lots of wavelengths are 0 or some nonsense garbage
  - src:
      fr_id: FR-FCM-ZZZ4
      file_names:
        - Beckman Coulter - MoFlo XDP.fcs
    options:
      # warnings_are_errors: true
      other_width: 14
      fix_log_scale_offsets: true
      ignore_time_optical_keys: [P, O, L, V]
      date_pattern: "%d %b %Y"
      demote_from_standard: [[], ["P[0-9]+L"]]
  
  - src:
      fr_id: FR-FCM-ZZZ4
      file_names:
        - Cytek DxP10 - 6-peak Q&b 11-06-2012 001.fcs
    options:
      warnings_are_errors: true
  
  - src:
      fr_id: FR-FCM-ZZZ4
      file_names:
        - Cytek DxP10 - APC COMP BEADS011.fcs
    options:
      warnings_are_errors: true
  
  - src:
      fr_id: FR-FCM-ZZZ4
      file_names:
        - Cytek DxP10 - BLANK COMP BEADS007.fcs
    options:
      warnings_are_errors: true
      
  - src:
      fr_id: FR-FCM-ZZZ4
      file_names:
        - Cytek DxP10 - FITC COMP BEADS008.fcs
    options:
      warnings_are_errors: true
      
  - src:
      fr_id: FR-FCM-ZZZ4
      file_names:
        - Cytek DxP10 - PERCP COMP BEADS010.fcs
    options:
      warnings_are_errors: true
      
  - src:
      fr_id: FR-FCM-ZZZ4
      file_names:
        - Cytek DxP10 - PE COMP BEADS009.fcs
    options:
      warnings_are_errors: true
      
  - src:
      fr_id: FR-FCM-ZZZ4
      file_names:
        - MVa2011-06-30_fcs30.fcs
    options:
      date_pattern: "%Y-%b-%d"
      # time might be "HDR-T" but they also didn't provide $TIMESTEP
