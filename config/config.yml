        - 151110_ASE001_758_moDC_DV4_8h.626420.fcs
        - 151110_ASE001_758_moDC_mock_8h.626412.fcs
    parse:
      machine: sbt_cytof2
      options:
        # lots of values which are just one space
        trim_value_whitespace: true
        allow_empty_values: true
        # one OTHER segment which is a bit too long for the file
        other_width: 20
        truncate_offsets: true
        append_standard_keywords:
          TIMESTEP: "1.0"

